# One-command local stack: Redis + admin + worker.
# Usage:
#   1. Copy env templates:
#        cp apps/admin/.env.example apps/admin/.env.local
#        cp apps/worker/.env.example apps/worker/.env
#      Fill in your secrets.
#   2. docker compose up -d --build
#   3. open http://localhost:3000/clone
#
# Notes:
# - REDIS_URL is overridden to the internal docker network hostname.
# - admin .env.local and worker .env are loaded as env_file at start.
# - To rebuild after code changes:  docker compose up -d --build

services:
  redis:
    image: redis:7-alpine
    container_name: vx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: vx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coloring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: vx-admin
    restart: unless-stopped
    env_file:
      - apps/admin/.env.local
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/coloring
      # Prisma schema declares directUrl = env("DIRECT_URL"). For local
      # Postgres (no pgbouncer) it's the same as DATABASE_URL.
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/coloring
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: vx-worker
    restart: unless-stopped
    env_file:
      - apps/worker/.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/coloring
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/coloring
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  mobile-api:
    build:
      context: .
      dockerfile: apps/mobile-api/Dockerfile
    container_name: vx-mobile-api
    restart: unless-stopped
    env_file:
      - apps/mobile-api/.env.local
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/coloring
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/coloring
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
