# Production override for docker-compose.yml.
# Usage (invoked by deploy.sh):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml <command>
#
# Swaps env_file entries so the admin + worker containers read production
# secrets from .env.prod instead of the local-dev .env.local / .env files.
# .env.prod files are git-ignored and must be created locally before deploy.

services:
  admin:
    build:
      args:
        # Enable real write actions on prod (bake NEXT_PUBLIC_COLORING_WRITE=1
        # into the client bundle at build time). Removes the write-gate.
        NEXT_PUBLIC_COLORING_WRITE: "1"
    env_file:
      - apps/admin/.env.prod

  worker:
    env_file:
      - apps/worker/.env.prod
    volumes:
      # KingCong session cookie persisted OUTSIDE the image + rsync tree so
      # runtime PHPSESSID refreshes survive restart/redeploy, and the cookie can
      # be hot-swapped (edit the host file + `docker restart vx-worker`) with no
      # rebuild. Pairs with KINGCONG_SESSION_FILE=/data/kingcong-session.json.
      # NOTE: mount the DIRECTORY, not the single file — Docker single-file bind
      # mounts decouple (writes stop reflecting to the host). The cookie lives at
      # /opt/vx-admin-data/kingcong-session.json — see docs/kingcong-image-provider.md.
      - /opt/vx-admin-data:/data

  mobile-api:
    env_file:
      - apps/mobile-api/.env.prod
